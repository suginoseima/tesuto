<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>完成版ガチャゲーム</title>
<style>
body{font-family:sans-serif;text-align:center;background:#111;color:#fff}
button{padding:10px 20px;font-size:18px;border-radius:10px;background:gold;border:none}
img{width:120px;margin-top:10px}
.gacha-box{margin:30px auto;padding:20px;width:300px;background:#222;border-radius:10px}
</style>
</head>
<body>

<h1>🎮 ガチャゲーム</h1>

<div class="gacha-box">
<p id="stone">💎 50</p>
<button onclick="drawGacha()">ガチャる！</button>
<div id="result"></div>
</div>

<script>
const items = [
 {name:"スライム",rarity:"N",rate:50,img:"https://via.placeholder.com/150?text=Slime"},
 {name:"ナイト",rarity:"R",rate:30,img:"https://via.placeholder.com/150?text=Knight"},
 {name:"ドラゴン",rarity:"SR",rate:15,img:"https://via.placeholder.com/150?text=Dragon"},
 {name:"神",rarity:"UR",rate:5,img:"https://via.placeholder.com/150?text=GOD"}
];

let stones = 50;

function drawGacha(){
 if(stones<=0){alert("石ない");return;}
 stones--;
 document.getElementById("stone").innerText="💎 "+stones;

 let rand=Math.random()*100;
 let sum=0;

 for(let item of items){
  sum+=item.rate;
  if(rand<=sum){
    showResult(item);
    return;
  }
 }
}

function showResult(item){
 document.getElementById("result").innerHTML=
 `<p>${item.rarity}</p>
  <p>${item.name}</p>
  <img src="${item.img}">`;
}
</script>

</body>
</html>
