<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限召喚 - Gacha Simulator</title>
    <style>
        :root {
            --rarity-r: #a0a0a0;
            --rarity-sr: #4ea8de;
            --rarity-ssr: #ffcc00;
            --bg-color: #1a1a2e;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            text-shadow: 0 0 10px #4ea8de;
            margin-bottom: 20px;
        }

        /* ガチャリザルトエリア */
        #display-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            min-height: 300px;
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #444;
            border-radius: 15px;
        }

        /* カードのデザイン */
        .card {
            width: 120px;
            height: 180px;
            background: #222;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 3px solid transparent;
        }

        @keyframes appear {
            from { transform: scale(0) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        .card.r { border-color: var(--rarity-r); }
        .card.sr { border-color: var(--rarity-sr); box-shadow: 0 0 15px var(--rarity-sr); }
        .card.ssr { border-color: var(--rarity-ssr); box-shadow: 0 0 25px var(--rarity-ssr); animation: ssr-glow 1s infinite alternate; }

        @keyframes ssr-glow {
            from { box-shadow: 0 0 10px var(--rarity-ssr); }
            to { box-shadow: 0 0 30px var(--rarity-ssr); }
        }

        .rarity-label {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .r .rarity-label { color: var(--rarity-r); }
        .sr .rarity-label { color: var(--rarity-sr); }
        .ssr .rarity-label { color: var(--rarity-ssr); }

        /* ボタン */
        .controls {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #16213e, #0f3460);
            border: 2px solid #4ea8de;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(78, 168, 222, 0.4);
            background: linear-gradient(45deg, #1a1a2e, #16213e);
        }

        button:active { transform: translateY(0); }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 演出用 */
        #status {
            margin-top: 15px;
            font-size: 1.2rem;
            height: 1.5rem;
            color: #4ea8de;
        }
    </style>
</head>
<body>

    <h1>✨ 超神話召喚 ✨</h1>

    <div id="display-area">
        </div>

    <div id="status"></div>

    <div class="controls">
        <button onclick="playGacha(1)">1回召喚</button>
        <button onclick="playGacha(10)">10回召喚</button>
    </div>

    <script>
        const displayArea = document.getElementById('display-area');
        const statusText = document.getElementById('status');
        const buttons = document.querySelectorAll('button');

        // ガチャのデータ設定
        const MASTER_DATA = [
            { rarity: 'SSR', prob: 0.05, label: 'SRR' },
            { rarity: 'SR', prob: 0.15, label: 'SR' },
            { rarity: 'R', prob: 0.80, label: 'R' }
        ];

        // ガチャ実行メイン関数
        async function playGacha(count) {
            // UIのリセットと無効化
            displayArea.innerHTML = '';
            toggleButtons(true);
            
            // 演出：タメの時間
            statusText.innerText = '召喚の儀を執り行っています...';
            await new Promise(resolve => setTimeout(resolve, 800));
            
            statusText.innerText = '';

            for (let i = 0; i < count; i++) {
                const result = draw();
                createCard(result);
                // 10連の時は少しずつ表示させる
                if (count > 1) await new Promise(resolve => setTimeout(resolve, 100));
            }

            toggleButtons(false);
            if (count === 10) statusText.innerText = '召喚完了！';
        }

        // 抽選ロジック
        function draw() {
            const rand = Math.random();
            let cumulativeProb = 0;

            for (const item of MASTER_DATA) {
                cumulativeProb += item.prob;
                if (rand < cumulativeProb) {
                    return item;
                }
            }
            return MASTER_DATA[MASTER_DATA.length - 1];
        }

        // カードのHTML要素を生成
        function createCard(data) {
            const card = document.createElement('div');
            card.className = `card ${data.rarity.toLowerCase()}`;
            
            card.innerHTML = `
                <div class="rarity-label">${data.rarity}</div>
                <div style="font-size: 0.8rem; opacity: 0.8;">Character</div>
            `;
            
            displayArea.appendChild(card);
        }

        // ボタンの活性・非活性切り替え
        function toggleButtons(disabled) {
            buttons.forEach(btn => btn.disabled = disabled);
        }
    </script>
</body>
</html>
